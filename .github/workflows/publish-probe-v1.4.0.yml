name: Publish Probe v1.4.0

# One-shot workflow for issue #27. It deliberately checks out the immutable
# v1.4.0 tag, builds on the same Windows image used for releases, and publishes
# directly from the runner so no locally built or relayed JAR can be uploaded.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-probe-v1.4.0
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    env:
      RELEASE_TAG: v1.4.0
      APP_VERSION: 1.4.0
      ARTIFACT_BASE: J2MEgram-Probe-1.4.0
      # Repository secrets are not automatically environment variables, but
      # make the intended empty credential profile explicit as defense in depth.
      TG_API_ID: ''
      TG_API_HASH: ''

    steps:
      - name: Check out the v1.4.0 release source
        uses: actions/checkout@v4
        with:
          ref: v1.4.0
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Point the toolchain at JDK 8
        shell: pwsh
        run: echo "JDK8_HOME=$env:JAVA_HOME" >> $env:GITHUB_ENV

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Cache pinned toolchain
        uses: actions/cache@v4
        with:
          path: sdk
          key: sdk-${{ runner.os }}-${{ hashFiles('tools/sdk.lock.json') }}

      - name: Verify fixed release target
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The checkout action already resolves the tag. Verify it directly;
          # do not trust a mutable branch name or a manually supplied input.
          $tagCommit = (git rev-list -n 1 $env:RELEASE_TAG).Trim()
          $headCommit = (git rev-parse HEAD).Trim()
          if ($headCommit -ne $tagCommit) {
            throw "checkout $headCommit is not $env:RELEASE_TAG ($tagCommit)"
          }

          $m = Select-String -Path tools/build.ps1 -Pattern '^\$AppVersion\s*=\s*"([^"]+)"' |
                 Select-Object -First 1
          if (-not $m) { throw 'cannot find $AppVersion in tools/build.ps1' }
          $sourceVersion = $m.Matches[0].Groups[1].Value
          if ($sourceVersion -ne $env:APP_VERSION) {
            throw "source version $sourceVersion is not $env:APP_VERSION"
          }

          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY `
            --json tagName,isDraft --jq '.tagName + " draft=" + (.isDraft|tostring)'

      - name: Bootstrap
        shell: pwsh
        run: ./tools/bootstrap.ps1

      - name: Desktop test suite
        shell: pwsh
        run: ./tools/test.ps1

      - name: Build Probe without credentials or development secrets
        shell: pwsh
        run: |
          ./tools/build.ps1 -Target probe -ArtifactName $env:ARTIFACT_BASE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Emulator smoke test
        shell: pwsh
        run: |
          # smoke-emulator.ps1 selects the Probe harness from a probe* filename.
          # Test an exact byte-for-byte alias of the versioned release JAR.
          $smokeName = 'probe-v1.4.0-release'
          $smokeJar = Join-Path $PWD "dist/$smokeName.jar"
          Copy-Item -LiteralPath (Join-Path $PWD "dist/$env:ARTIFACT_BASE.jar") -Destination $smokeJar
          try {
            ./tools/smoke-emulator.ps1 -SkipBuild -ArtifactName $smokeName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Remove-Item -LiteralPath $smokeJar -Force -ErrorAction SilentlyContinue
          }

      - name: Verify JAD and JAR metadata
        shell: pwsh
        run: |
          $jar = Join-Path $PWD "dist/$env:ARTIFACT_BASE.jar"
          $jad = Join-Path $PWD "dist/$env:ARTIFACT_BASE.jad"
          if (-not (Test-Path -LiteralPath $jar)) { throw "missing $jar" }
          if (-not (Test-Path -LiteralPath $jad)) { throw "missing $jad" }

          $text = Get-Content -LiteralPath $jad -Raw
          $jarUrl = ([regex]::Match($text, '(?m)^MIDlet-Jar-URL:\s*(.+)$')).Groups[1].Value.Trim()
          $jarSize = ([regex]::Match($text, '(?m)^MIDlet-Jar-Size:\s*(\d+)$')).Groups[1].Value
          $version = ([regex]::Match($text, '(?m)^MIDlet-Version:\s*(.+)$')).Groups[1].Value.Trim()
          $name = ([regex]::Match($text, '(?m)^MIDlet-Name:\s*(.+)$')).Groups[1].Value.Trim()

          if ($jarUrl -ne "$env:ARTIFACT_BASE.jar") { throw "unexpected MIDlet-Jar-URL: $jarUrl" }
          if ([int64]$jarSize -ne (Get-Item -LiteralPath $jar).Length) { throw 'MIDlet-Jar-Size mismatch' }
          if ($version -ne $env:APP_VERSION) { throw "unexpected MIDlet-Version: $version" }
          if ($name -ne 'J2MEgram Probe') { throw "unexpected MIDlet-Name: $name" }

      - name: Merge checksums and publish directly to v1.4.0
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $jarName = "$env:ARTIFACT_BASE.jar"
          $jadName = "$env:ARTIFACT_BASE.jad"
          $jar = Join-Path $PWD "dist/$jarName"
          $jad = Join-Path $PWD "dist/$jadName"
          $sumDir = Join-Path $env:RUNNER_TEMP 'existing-release-sums'
          New-Item -ItemType Directory -Force -Path $sumDir | Out-Null

          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY `
            --pattern SHA256SUMS.txt --dir $sumDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $oldSums = Join-Path $sumDir 'SHA256SUMS.txt'
          if (-not (Test-Path -LiteralPath $oldSums)) { throw 'release has no SHA256SUMS.txt' }

          $lines = @(Get-Content -LiteralPath $oldSums | Where-Object {
            $_ -and $_ -notmatch ('  (' + [regex]::Escape($jarName) + '|' + [regex]::Escape($jadName) + ')$')
          })
          $lines += "{0}  {1}" -f (Get-FileHash -LiteralPath $jad -Algorithm SHA256).Hash.ToLower(), $jadName
          $lines += "{0}  {1}" -f (Get-FileHash -LiteralPath $jar -Algorithm SHA256).Hash.ToLower(), $jarName
          $lines = @($lines | Sort-Object { ($_ -split '  ', 2)[1] })

          $mergedSums = Join-Path $PWD 'dist/SHA256SUMS.txt'
          [IO.File]::WriteAllText($mergedSums, ($lines -join "`n") + "`n")

          gh release upload $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY `
            $jad $jar $mergedSums --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify every published JAR and JAD
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $verifyDir = Join-Path $env:RUNNER_TEMP 'published-release'
          New-Item -ItemType Directory -Force -Path $verifyDir | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY `
            --pattern '*.jar' --pattern '*.jad' --pattern SHA256SUMS.txt --dir $verifyDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $sumFile = Join-Path $verifyDir 'SHA256SUMS.txt'
          $seen = @{}
          foreach ($line in Get-Content -LiteralPath $sumFile) {
            if ($line -notmatch '^([0-9a-f]{64})  (.+)$') { throw "malformed checksum line" }
            $expected = $Matches[1]
            $name = $Matches[2]
            $path = Join-Path $verifyDir $name
            if (-not (Test-Path -LiteralPath $path)) { throw "checksum references missing asset: $name" }
            $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $expected) { throw "checksum mismatch: $name" }
            $seen[$name] = $true
          }

          $packages = @(Get-ChildItem -LiteralPath $verifyDir -File | Where-Object {
            $_.Extension -in '.jar', '.jad'
          })
          foreach ($package in $packages) {
            if (-not $seen.ContainsKey($package.Name)) { throw "asset has no checksum: $($package.Name)" }
          }

          foreach ($required in @("$env:ARTIFACT_BASE.jar", "$env:ARTIFACT_BASE.jad")) {
            if (-not (Test-Path -LiteralPath (Join-Path $verifyDir $required))) {
              throw "published Probe asset missing: $required"
            }
          }
          Write-Host "verified $($packages.Count) published JAR/JAD assets"
